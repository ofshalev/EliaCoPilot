<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elia CoPilot — אירועים</title>
<style>
:root{font-family:Arial,sans-serif;color:#172b46;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0}
header{background:#14283f;color:white;padding:24px max(22px,calc((100vw - 1080px)/2))}
header strong{font-size:28px}header p{opacity:.8;margin:5px 0}
nav{display:flex;gap:10px;flex-wrap:wrap;padding:12px max(20px,calc((100vw - 1180px)/2));background:#e5edf7;border-bottom:1px solid #cbd6e3}
nav a{font-weight:700;color:#245bb4;text-decoration:none;background:#fff;border-radius:8px;padding:9px 13px}
nav a[aria-current]{color:#14263e}
main{max-width:1080px;margin:26px auto;padding:0 18px}
.card{background:white;border:1px solid #dce4ee;border-radius:14px;padding:24px;box-shadow:0 5px 20px #1025400c}
h1{margin:0 0 12px;font-size:25px}p{line-height:1.7}
.note{color:#52677d;margin:0}
/* Shared automatic work-week indicator */
header.hero,body>header{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;position:relative}
.elia-weeks{position:absolute;top:10px;left:18px;display:flex;direction:ltr;align-items:flex-start;gap:16px;margin:0;white-space:nowrap;font-family:Arial,sans-serif}
.elia-week-block{display:flex;flex-direction:column;align-items:center;gap:4px;direction:rtl}
.elia-week-label{font-size:16px;font-weight:700;color:#d0dbea;line-height:1.35}
.elia-week-next{display:block;text-align:center;background:#e8f1ff;color:#173e75;border:1px solid #9fc4fc;border-radius:9px;padding:8px 20px;font-size:34px;font-weight:800;line-height:1.25;min-width:74px}
.elia-week-current{display:block;text-align:center;color:#d0dbea;opacity:.56;font-size:20px;font-weight:700;line-height:1.3;padding:6px 10px}
.elia-week-block-current .elia-week-label{opacity:.56}
@media(max-width:600px){header.hero,body>header{padding-top:100px}.elia-week-next{font-size:28px;padding:7px 16px}.elia-week-current{font-size:16px}}

</style>
</head>
<body>
<header><div><strong>Elia CoPilot</strong><p>ניהול אירועי עבודות תחבורה ציבורית</p></div><div class="elia-weeks" aria-label="שבוע הבא והשבוע הנוכחי"><div class="elia-week-block"><span class="elia-week-label">שבוע הבא</span><span class="elia-week-next" id="eliaNextWeek">–</span></div><div class="elia-week-block elia-week-block-current"><span class="elia-week-label">שבוע נוכחי</span><span class="elia-week-current" id="eliaCurrentWeek">–</span></div></div></header>
<nav aria-label="כלי Elia CoPilot"><a href="./events.html" aria-current="page">📅 אירועים</a><a href="./segments.html" style="font-weight:700;color:#245bb4;text-decoration:none;background:#fff;border-radius:8px;padding:9px 13px">🛣️ מקטעים</a><a href="./index.html">✉️ מחולל מייל</a><a href="./word-generator.html">📄 מחולל Word</a><a href="./contacts.html">👥 קבוצות נמענים</a><a href="./sign-generator.html">🪧 מחולל שלטים</a><a href="./notice-template.html">📢 הודעה על רקע קבוע</a></nav>
<main><section class="card"><h1>אירועים</h1><p class="note">אזור חדש לניהול אירועי העבודות השבועיים. כאן נגדיר בהמשך את פרטי האירועים ואת המסמכים הקשורים לכל אירוע.</p></section></main>
<script>
/* ISO 8601 week numbers, calculated for Israel's local calendar date. */
(function(){
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const get=t=>Number(parts.find(p=>p.type===t).value);
 const today=new Date(Date.UTC(get('year'),get('month')-1,get('day')));
 function isoWeek(date){const d=new Date(date);const weekday=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-weekday);const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-yearStart)/86400000)+1)/7)}
 const next=new Date(today);next.setUTCDate(today.getUTCDate()+7);
 document.getElementById('eliaNextWeek').textContent=isoWeek(next);
 document.getElementById('eliaCurrentWeek').textContent=isoWeek(today);
})();
</script>
</body></html>
