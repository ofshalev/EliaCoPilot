<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elia CoPilot — מצב הנתונים</title><style>
:root{font-family:Arial,sans-serif;color:#172b46;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#14283f;color:white;padding:24px max(22px,calc((100vw - 1080px)/2))}header strong{font-size:28px}header p{opacity:.8;margin:5px 0}nav{display:flex;gap:10px;flex-wrap:wrap;padding:12px max(20px,calc((100vw - 1180px)/2));background:#e5edf7;border-bottom:1px solid #cbd6e3}nav a{font-weight:700;color:#245bb4;text-decoration:none;background:#fff;border-radius:8px;padding:9px 13px}nav a[aria-current]{color:#14263e;box-shadow:inset 0 -3px #2864e2}main{max-width:1080px;margin:26px auto;padding:0 18px}.card{background:white;border:1px solid #dce4ee;border-radius:14px;padding:24px;margin-bottom:16px;box-shadow:0 5px 20px #1025400c}h1{margin:0 0 12px;font-size:25px}h2{font-size:18px;margin:0 0 16px}p{line-height:1.7;color:#52677d}table{border-collapse:collapse;width:100%;text-align:right;font-size:14px}th,td{padding:12px 8px;border-bottom:1px solid #e3eaf3}th{background:#edf3fb}td a{color:#245bb4}button,.upload{font:700 13px Arial;background:#eaf0fa;color:#294968;border:0;border-radius:7px;padding:9px;cursor:pointer;display:inline-block}input{max-width:100%}.scroll{overflow-x:auto}.ok{color:#267046}.pending{color:#64778d}.code{display:inline-block;border-radius:6px;color:white;padding:5px 9px;font-weight:700;background:#64748b}.P{background:#7844aa}.B{background:#89552f}.G{background:#238455}small{color:#64778d}#message{white-space:pre-line}.projects{display:grid;gap:10px}.project{border:1px solid #dce4ee;border-radius:10px;overflow:hidden;border-inline-start:5px solid var(--project)}.project summary{cursor:pointer;list-style:none;padding:16px 18px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:space-between}.project summary::-webkit-details-marker{display:none}.project summary::after{content:"+";color:#64778d;font-size:21px}.project[open] summary::after{content:"−"}.project summary:hover{background:#f7faff}.preview{padding:0 14px 14px}.map{height:400px;background:#edf2f7;border:1px solid #dce4ee;border-radius:8px;direction:ltr}.status{margin:8px 0;color:#64778d;font-size:13px}.download{display:inline-block;margin-top:9px;color:#245bb4;font-size:13px}.fallback{width:100%;height:100%}@media(max-width:600px){.map{height:320px}}</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></head><body><header><strong>Elia CoPilot</strong><p>ניהול נתוני תחבורה ציבורית</p></header><nav aria-label="כלי Elia CoPilot"><a href="/events.html">📅 אירועים</a><a href="/segments.html">🛣️ מקטעים</a><a href="/contacts.html">👥 קבוצות נמענים</a><a href="/mail-generator.html">✉️ מחולל מייל</a><a href="/word-generator.html">📄 מחולל Word</a><a href="/sign-generator.html">🪧 מחולל שלטים</a><a href="/notice-template.html">📢 הודעה על רקע קבוע</a><a href="/data-status.html" aria-current="page">🗂️ מצב הנתונים</a><a href="/account">חשבון / יציאה</a></nav><main><section class="card"><h1>מצב הנתונים</h1><h2>נתונים גאוגרפיים</h2><div id="projects" class="projects"></div></section></main><script>
const projects=[['הקו הסגול','purple_line','#7844aa'],['הקו החום','brown_line','#89552f'],['הקו הירוק','green_line','#238455'],['מטרו M1','rishon_metro','#52657e'],['מטרו M3','holon_metro','#52657e']];
const root=document.getElementById('projects');
function fallback(el,data,color){
 const paths=[];function add(g){if(!g)return;switch(g.type){case 'FeatureCollection':g.features.forEach(add);break;case 'Feature':add(g.geometry);break;case 'GeometryCollection':g.geometries.forEach(add);break;case 'LineString':paths.push(g.coordinates);break;case 'MultiLineString':case 'Polygon':paths.push(...g.coordinates);break;case 'MultiPolygon':g.coordinates.forEach(p=>paths.push(...p));}}
 add(data);const points=paths.flat().filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(!points.length)throw Error('empty geometry');
 let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;for(const [x,y] of points){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}const cos=Math.cos((y0+y1)*Math.PI/360),w=800,h=400,scale=Math.min((w-40)/Math.max((x1-x0)*cos,1e-9),(h-40)/Math.max(y1-y0,1e-9)),ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 800 400');svg.setAttribute('class','fallback');for(const path of paths){const p=document.createElementNS(ns,'polyline');p.setAttribute('points',path.map(([x,y])=>[w/2+(x-(x0+x1)/2)*cos*scale,h/2-(y-(y0+y1)/2)*scale].join(',')).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width','3');p.setAttribute('stroke-linejoin','round');svg.append(p)}el.replaceChildren(svg);
}
for(const [name,base,color] of projects){
 const d=document.createElement('details');d.className='project';d.style.setProperty('--project',color);
 const summary=document.createElement('summary');summary.textContent=name;d.append(summary);
 const panel=document.createElement('div');panel.className='preview';const status=document.createElement('p');status.className='status';status.setAttribute('role','status');const mapEl=document.createElement('div');mapEl.className='map';const download=document.createElement('a');download.className='download';download.textContent='הורדת GeoJSON';download.href='/data/geography/'+base+'.geojson';download.download=base+'.geojson';download.hidden=true;panel.append(status,mapEl,download);d.append(panel);root.append(d);
 let map,loaded=false,loading=false;
 d.addEventListener('toggle',async()=>{if(!d.open)return;if(loaded){if(map)requestAnimationFrame(()=>map.invalidateSize());return}if(loading)return;loading=true;status.textContent='טוען נתונים…';
 try{const r=await fetch(download.href,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();
 if(window.L){map=L.map(mapEl);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const layer=L.geoJSON(data,{style:{color,weight:4,opacity:0.95}}).addTo(map);const bounds=layer.getBounds();if(!bounds.isValid())throw Error('empty geometry');map.fitBounds(bounds,{padding:[25,25],maxZoom:16});requestAnimationFrame(()=>{map.invalidateSize();map.fitBounds(bounds,{padding:[25,25],maxZoom:16})});status.textContent='';}
 else{fallback(mapEl,data,color);status.textContent='תצוגת תוואי ללא מפת רקע';}
 download.hidden=false;loaded=true;
 }catch(e){if(map){map.remove();map=null}status.textContent='לא ניתן לטעון את הנתונים. סגרו ופתחו שוב לניסיון נוסף.';}finally{loading=false}});
}
</script></body></html>
