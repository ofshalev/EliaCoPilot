<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elia CoPilot | משימות</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#173453;font:15px Arial,sans-serif}header{background:#fff;padding:18px 4%;border-bottom:1px solid #d8e1ec}nav{display:flex;gap:12px;flex-wrap:wrap}nav a{color:#294b78;text-decoration:none;padding:8px}nav a[aria-current]{background:#e6eefb;border-radius:8px;font-weight:bold}main{max-width:1200px;margin:24px auto;padding:0 16px}section,article{background:#fff;border:1px solid #d4dfeb;border-radius:12px;padding:18px;margin:12px 0}h1,h2,h3{margin:0 0 14px}label{display:block;font-size:13px;margin:8px 0}input,select,textarea,button{font:inherit;border:1px solid #c5d3e3;border-radius:7px;padding:9px;color:inherit}input,select,textarea{width:100%;background:#fff}textarea{min-height:90px}button{background:#e9eff8;cursor:pointer;font-weight:bold}button.primary{background:#2864e2;color:white}button:disabled{opacity:.5;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.muted{color:#657991;font-size:13px}.timer{font:bold 30px Arial;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}.late{color:#b91c1c}.soon{color:#b45309}.done{color:#16834a}.line{border-bottom:1px solid #e3eaf2;padding:8px 0}.purple{border-right:5px solid #7844aa}a{color:#2864e2}.status{white-space:pre-wrap;color:#a33}pre{white-space:pre-wrap;font:inherit;background:#f5f8fc;padding:10px;border-radius:8px} [hidden]{display:none!important}
</style><header><nav><a href="/events.html">📅 אירועים</a><a href="/tasks.html" aria-current="page">☑ משימות</a><a href="/segments.html">מקטעים</a><a href="/contacts.html">נמענים</a><a href="/mail-generator.html">מחולל מייל</a><a href="/word-generator.html">מחולל Word</a><a href="/sign-generator.html">מחולל שלטים</a><a href="/data-status.html">מצב הנתונים</a><a href="/account">חשבון</a></nav></header><main><h1>משימות</h1><p id="status" class="status" role="status"></p><div class="actions"><button id="refresh">רענן נתונים</button><button id="showDefs">סוגי משימות</button><button id="showNew" class="primary">+ משימה חדשה</button></div>
<section id="defs" hidden><h2>סוגי משימות</h2><div id="defList"></div><form id="defForm"><div class="grid"><label>שם משימה<input id="dName" required maxlength="200"></label><label>פרויקט<select id="dProject"><option>הקו הסגול</option><option>הקו החום</option><option>הקו הירוק</option><option value="">כל הפרויקטים</option></select></label><label>קבוצת נמענים<select id="dGroup"></select></label><label>משך לביצוע בשעות (קלנדריות)<input id="dHours" type="number" min="1" max="8760" required value="24"></label></div><label>הנחיות<textarea id="dInstructions"></textarea></label><label>נושא מייל (ניתן להשתמש ב- {week})<input id="dSubject"></label><label>פתיח למייל<textarea id="dBody"></textarea></label><div class="actions"><button class="primary">שמור סוג משימה</button><button type="button" id="sample">דוגמה: הגשת עבודות הקו הסגול</button><button type="button" id="clearDef">חדש</button></div></form></section>
<section id="newTask" hidden><h2>פתיחת משימה</h2><form id="taskForm"><div class="grid"><label>סוג משימה<select id="taskType" required></select></label><label>תאריך ושעת קבלה (שעון ישראל)<input id="received" type="datetime-local" required></label><label>מועד אחרון (שעון ישראל)<input id="due" type="datetime-local" required></label><label>שבוע עבודות — יום ראשון<input id="week" type="date" required></label></div><button class="primary">פתח משימה</button></form></section><h2>משימות פעילות</h2><div id="active"></div><h2>משימות שהושלמו</h2><div id="completed"></div></main><script>
'use strict';
const $=id=>document.getElementById(id),el=(tag,t)=>{const x=document.createElement(tag);if(t!=null)x.textContent=t;return x};
let data={definitions:[],tasks:[]},events=[],contacts={people:[],groups:[]},revision=null,busy=false,editId=null;
const status=t=>$('status').textContent=t;
const tz='Asia/Jerusalem',fmt=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function localValue(d){const p=Object.fromEntries(fmt.formatToParts(d).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute}
function isoLocal(v){if(!v)return null;let t=Date.parse(v+'Z');if(!Number.isFinite(t))return null;for(let i=0;i<3;i++)t+=Date.parse(v+'Z')-Date.parse(localValue(new Date(t))+'Z');return localValue(new Date(t))===v?new Date(t).toISOString():null}
const plus=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
function nextSunday(){const d=localValue(new Date()).slice(0,10),w=new Date(d+'T12:00:00Z').getUTCDay();return plus(d,7-w)}
const display=x=>new Date(x).toLocaleString('he-IL',{timeZone:tz,dateStyle:'short',timeStyle:'short'});
const uid=()=>crypto.randomUUID();
async function get(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('טעינה נכשלה: '+path);return r.json()}
async function load(){try{const [a,b,c]=await Promise.all(['/api/tasks','/api/events','/api/contacts'].map(get));data=a.data;revision=a.revision;events=b.events||[];contacts=c.data||{people:[],groups:[]};render();status('')}catch(e){status(e.message)}}
async function save(next){if(busy||revision==null)return false;busy=true;try{const r=await fetch('/api/tasks',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,data:next})});if(!r.ok)throw Error(r.status===409?'משתמש אחר עדכן את המשימות. רעננו ונסו שוב.':'שמירת משימות נכשלה');revision=(await r.json()).revision;data=next;render();status('');return true}catch(e){status(e.message);return false}finally{busy=false}}
function options(select,items,empty){const prev=select.value;select.replaceChildren();if(empty){const o=el('option',empty);o.value='';select.append(o)}for(const [id,name] of items){const o=el('option',name);o.value=id;select.append(o)}if([...select.options].some(o=>o.value===prev))select.value=prev}
function button(t,fn){const b=el('button',t);b.type='button';b.onclick=fn;return b}
function fillDef(d){editId=d?.id||null;$('dName').value=d?.name||'';$('dProject').value=d?.project??'הקו הסגול';$('dGroup').value=d?.groupId||'';$('dHours').value=d?.durationHours||24;$('dInstructions').value=d?.instructions||'';$('dSubject').value=d?.subject||'';$('dBody').value=d?.body||''}
$('sample').onclick=()=>fillDef({name:'הגשת עבודות הקו הסגול לאישור',project:'הקו הסגול',durationHours:24,instructions:'בדיקת רשימת העבודות והכנת מצגות PDF להגשה. יש לוודא שכל הקבצים והנמענים נבדקו.',subject:'עבודות הקו הסגול לאישור – {week}',body:'שלום רב,\nמצורפות עבודות הקו הסגול לאישור:'});
$('clearDef').onclick=()=>fillDef(null);
$('defForm').onsubmit=async e=>{e.preventDefault();const d={id:editId||uid(),name:$('dName').value.trim(),project:$('dProject').value,groupId:$('dGroup').value,durationHours:Number($('dHours').value),instructions:$('dInstructions').value,subject:$('dSubject').value,body:$('dBody').value};if(!d.name)return;const next=structuredClone(data);next.definitions=next.definitions.filter(x=>x.id!==d.id);next.definitions.push(d);if(await save(next))fillDef(null)};
function setDue(){const d=data.definitions.find(x=>x.id===$('taskType').value),start=isoLocal($('received').value);if(d&&start)$('due').value=localValue(new Date(Date.parse(start)+d.durationHours*3600000))}
$('taskType').onchange=setDue;$('received').onchange=setDue;
$('taskForm').onsubmit=async e=>{e.preventDefault();const d=data.definitions.find(x=>x.id===$('taskType').value),receivedAt=isoLocal($('received').value),dueAt=isoLocal($('due').value),weekStart=$('week').value;if(!d||!receivedAt||!dueAt||dueAt<=receivedAt||new Date(weekStart+'T12:00:00Z').getUTCDay()!==0){status('בדקו את התאריכים: מועד אחרון אחרי הקבלה ושבוע מתחיל ביום ראשון.');return}const next=structuredClone(data);next.tasks.push({...d,id:uid(),definitionId:d.id,receivedAt,dueAt,weekStart,completedAt:null});if(await save(next))$('newTask').hidden=true};
function relevant(t){const end=plus(t.weekStart,7);return events.filter(e=>e.noTransitImpact!==true&&e.eventStatus!=='בוטל'&&(!t.project||e.railLine===t.project)&&(e.blockages?.length?e.blockages:[e]).some(b=>b.workType==='עבודות רצופות'?b.dateFrom<end&&b.dateTo>=t.weekStart:(b.selectedDates?.length?b.selectedDates:[b.dateFrom||e.dateFrom]).some(d=>d>=t.weekStart&&d<end))).sort((a,b)=>String(a.segment||'').localeCompare(String(b.segment||''),'en',{numeric:true}))}
function recipients(t){const g=contacts.groups.find(x=>x.id===t.groupId),resolve=ids=>(ids||[]).map(id=>contacts.people.find(p=>p.id===id)?.email).filter(Boolean);return {to:resolve(g?.to),cc:resolve(g?.cc),name:g?.name||'לא נבחרה קבוצה'}}
function describe(e){return [e.city,e.segment,e.eventTitle||e.street,(e.selectedDates||[]).join(' + ')||[e.dateFrom,e.dateTo].filter(Boolean).join('–')].filter(Boolean).join(' · ')}
function emailText(t,works){const r=recipients(t),week=t.weekStart+' – '+plus(t.weekStart,4),subject=(t.subject||t.name).replaceAll('{week}',week);return 'אל: '+r.to.join('; ')+'\nעותק: '+r.cc.join('; ')+'\nנושא: '+subject+'\n\n'+t.body+'\n\n'+works.map((e,i)=>(i+1)+'. '+describe(e)).join('\n')}
function tick(){const now=Date.now();for(const n of document.querySelectorAll('[data-due]')){const start=Date.parse(n.dataset.start),end=Date.parse(n.dataset.due),finished=n.dataset.finished,delta=end-(finished?Date.parse(finished):now),abs=Math.abs(delta),h=Math.floor(abs/3600000),m=Math.floor(abs/60000)%60,s=Math.floor(abs/1000)%60;n.textContent=finished?'הושלמה':now<start?'טרם התחילה':(delta<0?'חריגה: ':'')+h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');n.className='timer '+(finished?'done':delta<0?'late':delta<3600000?'soon':'')}}
function card(t){const a=el('article');if(t.project==='הקו הסגול')a.className='purple';a.append(el('h3',t.name),el('div','שבוע עבודות: '+t.weekStart+' – '+plus(t.weekStart,4)),el('p','התקבלה: '+display(t.receivedAt)+' | מועד אחרון: '+display(t.dueAt)));const timer=el('div');timer.dataset.due=t.dueAt;timer.dataset.start=t.receivedAt;timer.dataset.finished=t.completedAt||'';a.append(timer);if(t.instructions)a.append(el('pre',t.instructions));const works=relevant(t),r=recipients(t);a.append(el('h3','נמענים: '+r.name),el('div','אל: '+r.to.join('; ')),el('div','עותק: '+r.cc.join('; ')),el('h3','עבודות רלוונטיות ('+works.length+')'));for(const e of works){const row=el('div',describe(e)+' · '+(e.hasPpt?'מצגת סומנה כמוכנה':'טרם סומנה מצגת'));row.className='line';a.append(row)}const note=el('p','סימון מצגת אינו קובץ PDF. בשלב זה יש לצרף את הקבצים ידנית ולבדוק את הרשימה לפני השליחה.');note.className='muted';a.append(note);const details=el('details');details.append(el('summary','טיוטת מייל'),el('pre',emailText(t,works)));a.append(details);const actions=el('div');actions.className='actions';actions.append(button('העתק טיוטת מייל',async()=>{try{await navigator.clipboard.writeText(emailText(t,works));status('טיוטת המייל הועתקה')}catch{status('לא ניתן להעתיק — פתחו את טיוטת המייל וסמנו את הטקסט')}}),button(t.completedAt?'פתח מחדש':'סמן כהושלמה',async()=>{if(!t.completedAt&&!confirm('האם המשימה הושלמה בפועל?'))return;const n=structuredClone(data);n.tasks.find(x=>x.id===t.id).completedAt=t.completedAt?null:new Date().toISOString();await save(n)}));a.append(actions);return a}
function render(){options($('dGroup'),contacts.groups.map(g=>[g.id,g.name]),'בחרו קבוצה');options($('taskType'),data.definitions.map(d=>[d.id,d.name]),'בחרו סוג');$('defList').replaceChildren();for(const d of data.definitions){const row=el('div');row.className='bar line';row.append(el('span',d.name+' · '+d.durationHours+' שעות'),button('ערוך',()=>fillDef(d)));$('defList').append(row)}for(const [id,done] of [['active',false],['completed',true]]){const list=$(id);list.replaceChildren();const tasks=data.tasks.filter(t=>!!t.completedAt===done).sort((a,b)=>a.dueAt.localeCompare(b.dueAt));if(!tasks.length)list.append(el('p','אין משימות'));for(const t of tasks)list.append(card(t))}tick()}
$('showDefs').onclick=()=>$('defs').hidden=!$('defs').hidden;$('showNew').onclick=()=>{$('newTask').hidden=!$('newTask').hidden;if(!$('newTask').hidden){$('received').value=localValue(new Date());$('week').value=nextSunday();setDue()}};$('refresh').onclick=load;setInterval(tick,1000);load();
</script></html>
